run:
  name: gpt2_real_corpus_ppl
  root: run
  seed: 42
model:
  name_or_path: gpt2-large
  device: cuda
  dtype: float16
  cache_dir: null
distributed:
  control_timeout_seconds: 7200
evaluation:
  num_samples: 512
  batch_size: 8
  max_length: 1024
data:
  hf_cache_dir: null
  lm1b:
    dataset: dvruette/lm1b
    dataset_config: default
    revision: refs/convert/parquet
    split: test
    tail_documents: null
    detokenize: true
    local_dataset: null
  owt:
    dataset: Skylion007/openwebtext
    dataset_config: default
    revision: refs/convert/parquet
    split: train
    tail_documents: 100000
    detokenize: false
    local_dataset: null
