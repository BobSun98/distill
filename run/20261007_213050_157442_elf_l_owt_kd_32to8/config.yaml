run:
  name: elf_l_owt_kd_32to8
  root: run
  seed: 42
model:
  teacher: embedded-language-flows/ELF-L-owt-torch
  checkpoint_file: null
  use_ema: true
  encoder: t5-small
  cache_dir: null
  device: cuda
  use_bf16: true
  keep_layers:
  - 3
  - 7
  - 11
  - 15
  - 19
  - 23
  - 27
  - 31
  gradient_checkpointing: true
  architecture:
    text_encoder_dim: 512
    max_length: 1024
    hidden_size: 1280
    depth: 32
    num_heads: 16
    mlp_ratio: 4.0
    attn_drop: 0.0
    proj_drop: 0.0
    bottleneck_dim: 128
    num_time_tokens: 4
    num_self_cond_cfg_tokens: 4
    num_model_mode_tokens: 4
    vocab_size: 32100
    gradient_checkpointing: false
distributed:
  control_timeout_seconds: 7200
  tensor_timeout_seconds: 180
data:
  dataset: embedded-language-flows/openwebtext-t5
  local_dataset: null
  hf_cache_dir: null
  prepared_root: run/data
  sequence_length: 1024
  validation_documents: 100000
  train_documents: 20000
  valid_documents: 128
  max_train_blocks: 8192
  max_valid_blocks: 128
diffusion:
  latent_mean: 0.0
  latent_std: 0.2
  denoiser_p_mean: -1.5
  denoiser_p_std: 0.8
  denoiser_noise_scale: 2.0
  time_schedule: logit_normal
  t_eps: 0.05
  decoder_probability: 0.2
  decoder_p_mean: 0.8
  decoder_p_std: 0.8
  decoder_noise_scale: 5.0
  self_cond_cfg_min: 0.5
  self_cond_cfg_max: 5.0
loss:
  flow_weight: 1.0
  kd_weight: 1.0
  ce_weight: 0.0
  native_flow_weight: 0.0
training:
  max_steps: 5000
  batch_size: 1
  grad_accumulation: 8
  learning_rate: 3.0e-05
  weight_decay: 0.01
  max_grad_norm: 1.0
  self_condition_probability: 0.5
  log_every: 10
  validate_every: 100
  validation_batches: 16
  save_every: 500
  early_stopping:
    enabled: true
    metric: loss
    min_steps: 500
    patience: 5
    min_delta: 0.001
evaluation:
  seed: 42
  num_samples: 512
  batch_size: 1
  num_steps: 64
  sequence_length: 1024
  scorer: gpt2-large
  scorer_batch_size: 8
  scorer_max_length: 1024
  sampling:
    sampling_method: sde
    time_schedule: logit_normal
    sde_gamma: 1.0
    cfg_scale: 1.0
    self_cond_cfg_scale: 3.0
