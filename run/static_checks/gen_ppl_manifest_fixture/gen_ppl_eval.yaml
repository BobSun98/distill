run:
  name: unified_gen_ppl
  root: run
protocol:
  version: gen_ppl_v1
  seed: 42
  num_samples: 1024
  scorer: gpt2-large
  scorer_max_length: 1024
runtime:
  device: cuda
  cache_dir: null
  generation_batch_size: 8
  control_timeout_seconds: 7200
models:
- name: student6
  architecture: run/example/config.json
  weights: run/example/model.safetensors
  generation:
    num_steps: 128
    sequence_length: 1024
