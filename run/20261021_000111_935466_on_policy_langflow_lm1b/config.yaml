run:
  name: on_policy_langflow_lm1b
  root: run
  seed: 42
model:
  family: langflow
  device: cuda
  cache_dir: null
  student_weights: run/20261020_021521_191614_lm1b_kd_12to6_lr1e-3/checkpoints/best
  student_config: null
  teacher: Continuous-Rivals-Discrete/langflow-lm1b
  teacher_config: null
  tokenizer: bert-base-uncased
  architecture_config: null
  checkpoint_file: null
  use_ema: true
  use_bf16: false
  gradient_checkpointing: false
  keep_layers:
  - 0
  - 2
  - 4
  - 7
  - 9
  - 11
distributed:
  control_timeout_seconds: 7200
  tensor_timeout_seconds: 180
loss:
  ce_weight: 1.0
  mse_weight: 0.0
  ce_target: soft
on_policy:
  rollout_batch_size: 32
  states_per_rollout: 8
  buffer_capacity: 2048
  refresh_every: 16
  decoder_probability: 0.2
training:
  max_steps: 5000
  batch_size: 64
  grad_accumulation: 1
  learning_rate: 0.0001
  lr_scheduler:
    name: cosine
    final_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  log_every: 10
  validate_every: 100
  validation_batches: 2
  save_every: 2500
  plot_loss: true
  ppl_evaluation:
    enabled: false
    interval: 500
    batch_size: 2
  early_stopping:
    enabled: true
    metric: error
    min_steps: 500
    patience: 5
    min_delta: 0.001
evaluation:
  seed: 42
  num_steps: 128
  sequence_length: 128
  batch_size: 8
  num_samples: 1024
  scorer: gpt2-large
  scorer_batch_size: 4
  scorer_max_length: 1024
