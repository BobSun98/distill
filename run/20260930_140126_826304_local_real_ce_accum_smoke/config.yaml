run:
  name: local_real_ce_accum_smoke
  root: run
  seed: 42
model:
  teacher: run/local_assets/langflow-owt
  teacher_config: null
  tokenizer: run/local_assets/gpt2
  cache_dir: null
  keep_layers:
  - 0
  - 2
  - 4
  - 7
  - 9
  - 11
  device: cpu
data:
  dataset: Skylion007/openwebtext
  dataset_config: plain_text
  revision: refs/convert/parquet
  local_dataset: run/local_assets/owt_smoke_raw
  hf_cache_dir: null
  prepared_root: run/data_model_checks
  sequence_length: 16
  validation_documents: 4
  train_documents: 4
  valid_documents: 4
  max_train_blocks: 8
  max_valid_blocks: 4
  tokenize_batch_size: 128
loss:
  kd_weight: 0
  ce_weight: 1
training:
  max_steps: 1
  batch_size: 3
  grad_accumulation: 3
  learning_rate: 3.0e-05
  weight_decay: 0.01
  max_grad_norm: 1.0
  self_condition_probability: 0.25
  log_every: 1
  validate_every: 3
  validation_batches: 1
  save_every: 0
evaluation:
  seed: 2026
  num_samples: 2
  batch_size: 1
  num_steps: 8
  sequence_length: 128
  scorer: null
  scorer_batch_size: 1
  scorer_max_length: 1024
