run:
  name: student_10_layers
  root: run
  seed: 42
model:
  teacher: Continuous-Rivals-Discrete/langflow-owt
  teacher_config: null
  tokenizer: gpt2
  cache_dir: null
  keep_layers:
  - 0
  - 1
  - 2
  - 4
  - 5
  - 6
  - 7
  - 9
  - 10
  - 11
  device: cuda
distributed:
  control_timeout_seconds: 7200
  tensor_timeout_seconds: 180
data:
  corpus: owt
  dataset: Skylion007/openwebtext
  dataset_config: default
  revision: refs/convert/parquet
  local_dataset: null
  hf_cache_dir: null
  prepared_root: run/data
  sequence_length: 1024
  validation_documents: 100000
  train_documents: 20000
  valid_documents: 128
  max_train_blocks: 8192
  max_valid_blocks: 128
  tokenize_batch_size: 128
loss:
  kd_weight: 1.0
  ce_weight: 0.0
training:
  plot_loss: true
  ppl_evaluation:
    enabled: true
    interval: -1
    num_samples_per_rank: 42
    batch_size: 14
  max_steps: 5000
  batch_size: 4
  grad_accumulation: 2
  learning_rate: 3.0e-05
  weight_decay: 0.01
  max_grad_norm: 1.0
  self_condition_probability: 0.25
  log_every: 10
  validate_every: 100
  validation_batches: 8
  save_every: 0
  early_stopping:
    enabled: false
    metric: loss
    min_steps: 500
    patience: 5
    min_delta: 0.001
evaluation:
  seed: 2026
  num_samples: 512
  batch_size: 32
  num_steps: 1024
  sequence_length: 1024
  scorer: gpt2-large
  scorer_batch_size: 4
  scorer_max_length: 1024
sweep:
  teacher_depth: 12
  student_depths:
  - 11
  - 10
  - 9
  - 8
  - 7
  - 6
  layer_selection: uniform
