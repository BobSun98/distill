extends: owt_progressive_rank.yaml

run:
  name: langflow_owt_progressive_svd_rank_debug

progressive_rank:
  # 仍保留真实 12 层与全部低秩投影，走完 80 -> 70 -> 60 两级传递。
  end_percent: 60

rank_sweep:
  plot_results: false

execution:
  backend: eager

data:
  sequence_length: 128
  train_documents: 32
  valid_documents: 16
  max_train_blocks: 8
  max_valid_blocks: 4

training:
  plot_loss: false
  max_steps: 3
  batch_size: 1
  grad_accumulation: 1
  log_every: 1
  validate_every: 3
  validation_batches: 1
  early_stopping:
    enabled: false

evaluation:
  num_samples: 4
  batch_size: 1
  num_steps: 8
  sequence_length: 128
