extends: elf_b_kd.yaml

run:
  name: elf_b_real_debug

data:
  # 保留正式 teacher/student 架构，只缩短真实数据与实际运行。
  sequence_length: 128
  train_documents: 32
  valid_documents: 16
  max_train_blocks: 8
  max_valid_blocks: 4

training:
  max_steps: 3
  batch_size: 1
  grad_accumulation: 1
  log_every: 1
  validate_every: 3
  validation_batches: 1
  save_every: 0
  early_stopping:
    enabled: false

evaluation:
  num_samples: 2
  num_steps: 4
  sequence_length: 128
  # debug 验证保存/重载与真实采样；正式 all 再计算 GPT-2-large Gen. PPL。
  scorer: null
