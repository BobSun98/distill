extends: on_policy_base.yaml

run:
  name: on_policy_langflow_owt

model:
  # OWT 12→6 off-policy half-student（lr=1e-3，depth-sweep student_06）。
  student_weights: run/20261019_074440_709356_langflow_owt_depth_sweep_lr1e-3_unified/student_06_layers/checkpoints/step_005000
  student_config: null
  teacher: Continuous-Rivals-Discrete/langflow-owt
  tokenizer: gpt2

loss:
  ce_weight: 1.0
  mse_weight: 0.0

training:
  # A6000 实测：bs=24 单卡峰值 ~41 GiB（nvidia-smi），bs>=32 OOM。
  batch_size: 24

on_policy:
  # owt 的 rollout 是算力瓶颈（单条 ~18s，不随 batch 摊薄），所以靠每条轨迹多取时间点补足新状态：
  # 每次刷新新增 2×48=96 个状态（~33s），buffer 容纳 8 次刷新。
  rollout_batch_size: 2
  states_per_rollout: 48
  buffer_capacity: 768
