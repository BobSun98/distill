run:
  name: unified_gen_ppl
  root: run

# 正式评测固定这些字段，不能用 --set 改成另一套标准。
protocol:
  version: gen_ppl_v1
  seed: 42
  num_samples: 1024
  scorer: gpt2-large
  scorer_max_length: 1024

# GM 需要 GPT-2-Large 反向传播；使用 gen_ppl_gm.yaml 开启，不增加默认 PPL 预算。
gradient_moment:
  enabled: false
  reference_config: configs/gpt2_corpus_ppl.yaml

runtime:
  device: cuda
  cache_dir: null
  generation_batch_size: 8
  # 每卡每个模型跳过前 5 次实际前向，计时不额外生成样本。
  timing_warmup_forwards: 5
  control_timeout_seconds: 7200

# corpus 指定可选 GM 的真实参考语料；架构/权重的 HF 引用可替换为本地文件路径。
models:
  - name: langflow_owt
    corpus: owt
    architecture:
      repo_id: Continuous-Rivals-Discrete/langflow-owt
      filename: config.json
    weights:
      repo_id: Continuous-Rivals-Discrete/langflow-owt
      filename: model.safetensors
    generation:
      num_steps: 1024
      sequence_length: 1024
  - name: langflow_lm1b
    corpus: lm1b
    architecture:
      repo_id: Continuous-Rivals-Discrete/langflow-lm1b
      filename: config.json
    weights:
      repo_id: Continuous-Rivals-Discrete/langflow-lm1b
      filename: model.safetensors
    generation:
      num_steps: 128
      sequence_length: 128
