run:
  name: owt_kd_12to6
  root: run
  seed: 42

model:
  teacher: Continuous-Rivals-Discrete/langflow-owt
  # 本地 safetensors 文件可通过 teacher_config 指定架构配置。
  teacher_config: null
  tokenizer: gpt2
  cache_dir: null
  keep_layers: [0, 2, 4, 7, 9, 11]
  device: cuda

distributed:
  # CPU 等待允许首次下载；GPU collective 使用较短超时，避免无输出地等待两小时。
  control_timeout_seconds: 7200
  tensor_timeout_seconds: 180

data:
  corpus: owt
  dataset: Skylion007/openwebtext
  dataset_config: default
  # 使用原数据集的 Parquet 转换，兼容不再支持 dataset script 的新版本 datasets。
  revision: refs/convert/parquet
  # 已有原始 OWT Dataset.save_to_disk 缓存时可直接加载，目录中需有 text 列。
  local_dataset: null
  hf_cache_dir: null
  prepared_root: run/data
  sequence_length: 1024
  # 与现有 LangFlow OWT split 一致：最后 100000 篇保留为验证集。
  validation_documents: 100000
  train_documents: 20000
  valid_documents: 128
  max_train_blocks: 8192
  max_valid_blocks: 128
  tokenize_batch_size: 128

loss:
  kd_weight: 1.0
  ce_weight: 0.0

training:
  # 硬上限；达到平台期可以更早结束。
  max_steps: 5000
  # 每卡 batch；默认八卡时 global batch = 8 × 4 × 2 = 64。
  batch_size: 14
  grad_accumulation: 2
  learning_rate: 0.00003
  weight_decay: 0.01
  max_grad_norm: 1.0
  self_condition_probability: 0.25
  log_every: 10
  validate_every: 100
  validation_batches: 8
  save_every: 500
  early_stopping:
    enabled: true
    # 验证 loss 最小化：KD-only 为 KL，CE-only 为 CE，也可明确指定 kl 或 ce。
    metric: loss
    min_steps: 500
    # 按验证次数计数；每 100 步验证一次时，5 次通常对应 500 步。
    patience: 5
    # 绝对下降至少 0.001 才重置平台计数；最佳 checkpoint 仍保留实际最低值。
    min_delta: 0.001

evaluation:
  seed: 2026
  num_samples: 32
  batch_size: 4
  # 正式比较 teacher/pruned/trained 时，三者使用相同 NFE 与生成长度。
  num_steps: 1024
  sequence_length: 1024
  scorer: gpt2-large
  scorer_batch_size: 4
  scorer_max_length: 1024
