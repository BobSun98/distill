extends: on_policy_elf_l.yaml

run:
  name: on_policy_elf_l_debug

on_policy:
  states_per_rollout: 4
  rollout_batch_size: 1
  refresh_every: 1
  buffer_capacity: 16

training:
  max_steps: 3
  batch_size: 1
  grad_accumulation: 1
  log_every: 1
  validate_every: 3
  validation_batches: 1
  save_every: 0
  plot_loss: false
  early_stopping:
    enabled: false
  ppl_evaluation:
    enabled: false

evaluation:
  num_steps: 8
  sequence_length: 128
  batch_size: 1
  num_samples: 4
