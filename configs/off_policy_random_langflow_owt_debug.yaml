extends: off_policy_random_langflow_owt.yaml

run:
  name: off_policy_random_langflow_owt_debug

data:
  sequence_length: 128
  train_documents: 32
  valid_documents: 16
  max_train_blocks: 8
  max_valid_blocks: 4

training:
  plot_loss: false
  max_steps: 3
  batch_size: 1
  grad_accumulation: 1
  log_every: 1
  validate_every: 3
  validation_batches: 1
  save_every: 0
  early_stopping:
    enabled: false

evaluation:
  num_samples: 2
  batch_size: 1
  num_steps: 8
  sequence_length: 128
