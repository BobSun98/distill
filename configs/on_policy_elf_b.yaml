extends: on_policy_base.yaml

run:
  name: on_policy_elf_b

model:
  family: elf
  # ELF-B 12→6 off-policy half-student（lr=1e-3 stage-1 best），深度从权重架构读取。
  student_weights: run/20261020_025737_021127_elf_b_owt_kd_12to6_lr1e-3/checkpoints/best
  student_config: null
  teacher: embedded-language-flows/ELF-B-owt-torch
  architecture_config: configs/architectures/elf_b.json
  tokenizer: t5-small
  use_bf16: true

training:
  # bs=128 单卡 ~42 GiB（allocated），bs>=160 OOM；取 16 使全局 128 序列，与 off-policy 一致。
  batch_size: 16

on_policy:
  # 每次刷新新增 8×8=64 个状态，buffer 容纳 8 次刷新。
  rollout_batch_size: 8
  buffer_capacity: 512

loss:
  # MSE-only；如需同时恢复 decoder，可设置 ce_weight=1。
  ce_weight: 0.0
  mse_weight: 1.0

evaluation:
  num_steps: 32
  batch_size: 2
  sampling:
    sampling_method: sde
    time_schedule: logit_normal
    sde_gamma: 1.5
    cfg_scale: 1.0
    self_cond_cfg_scale: 3.0
