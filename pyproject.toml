[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-dlm-distill"
version = "0.1.0"
description = "Config-driven capacity distillation for continuous diffusion language models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.38,<6",
    "datasets>=2.19,<5",
    "einops",
    "safetensors",
    "huggingface-hub",
    "PyYAML>=6",
]

[tool.setuptools.packages.find]
where = ["src"]
